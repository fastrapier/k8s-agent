# Сценарий S1 — CrashLoopBackOff (ТЗ раздел 2; вариация «нет env» из EVALS раздел 4.2).
#
# Имена зафиксированы ТЗ: Deployment api в namespace payments. Менять нельзя —
# на них ссылается запрос пользователя «Под api в namespace payments в CrashLoopBackOff».
#
# Поломка: контейнеру не передана переменная окружения DB_PASSWORD. В манифесте заданы
#   DB_HOST, DB_NAME и DB_USER, а блока с secretKeyRef на ключ password из Secret payments-db
#   нет — при выкатке релиза его потеряли. Процесс проверяет переменную на старте и падает.
#
# Симптом, который увидит инженер:
#   - kubectl get pods -n payments  →  api-xxxx  0/1  CrashLoopBackOff, RESTARTS растут;
#   - kubectl logs (и logs --previous) →  "FATAL: environment variable DB_PASSWORD is not set";
#   - kubectl describe pod → Last State: Terminated, Reason: Error, Exit Code: 1;
#   - в самом манифесте видно, что среди env нет DB_PASSWORD.
#
# Ожидаемое исправление (EVALS, поле fix): добавить env DB_PASSWORD с valueFrom.secretKeyRef
#   на payments-db/password, то есть патч по пути spec.template.spec.containers[0].env.
#   Образец того, как должно быть, лежит рядом — base/30-deployment-checkout.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: payments
  labels:
    app: api
    app.kubernetes.io/part-of: k8s-incident-agent-stand
    stand.k8s-incident-agent/scenario: s1
  annotations:
    stand.k8s-incident-agent/root-cause: "не задана переменная окружения DB_PASSWORD"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
        stand.k8s-incident-agent/scenario: s1
    spec:
      containers:
        - name: api
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "[api] starting, version 1.4.2"
              echo "[api] config: host=${DB_HOST} db=${DB_NAME} user=${DB_USER}"
              if [ -z "${DB_PASSWORD:-}" ]; then
                echo "[api] FATAL: environment variable DB_PASSWORD is not set; cannot connect to database ${DB_NAME}" >&2
                exit 1
              fi
              echo "[api] connected, listening on :8080"
              mkdir -p /www && echo "api ok" > /www/index.html
              exec httpd -f -p 8080 -h /www
          env:
            - name: DB_HOST
              value: postgres.payments.svc.cluster.local
            - name: DB_NAME
              value: payments
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: payments-db
                  key: username
            # ПОЛОМКА S1: здесь должен был быть DB_PASSWORD из Secret payments-db (ключ password).
            # Ср. base/30-deployment-checkout.yaml, где этот блок на месте.
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: payments
  labels:
    app: api
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 80
      targetPort: http

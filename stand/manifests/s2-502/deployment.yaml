# Сценарий S2 — «Сервис отдаёт 502 после релиза» (ТЗ раздел 2;
# вариация «selector сервиса не совпал с подами» из EVALS раздел 4.2).
#
# Часть 1 из 3: сами поды. Они ЗДОРОВЫ — это важно для сценария: инженер видит 502,
# но с подами всё в порядке, поэтому диагностика обязана пройти цепочку
# Ingress → Service → Endpoints → Pods, а не остановиться на первом шаге.
#
# В релизе v2 к подам добавили метку version: v2 (раньше было v1), а selector сервиса
# обновить забыли — см. service.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: payments
  labels:
    app: web
    app.kubernetes.io/part-of: k8s-incident-agent-stand
    stand.k8s-incident-agent/scenario: s2
  annotations:
    kubernetes.io/change-cause: "release v2: добавлена метка version=v2"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
      version: v2
  template:
    metadata:
      labels:
        app: web
        # Релиз v2: метку добавили тут...
        version: v2
        stand.k8s-incident-agent/scenario: s2
    spec:
      containers:
        - name: web
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "[web] starting, version 2.0.0"
              mkdir -p /www && echo "web v2 ok" > /www/index.html
              echo "[web] listening on :8080"
              exec httpd -f -p 8080 -h /www
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi

# Конфиг egress-прокси. Логика: всё запрещено, кроме CONNECT к адресам из allowlist
# и только на порты 443 (LLM-шлюз) и 6443 (API-сервер kind).
Port 8888
Listen 0.0.0.0
Timeout 600
# Логи — в stdout (`docker compose logs egress-proxy`): видно, что и куда отклонено.
LogLevel Info
MaxClients 50

# Клиенты — только из внутренней сети агента; адресов там нет, кроме агента и прокси.
Allow 0.0.0.0/0

# Порты для CONNECT. Всё остальное, например kubelet на 10250 той же ноды, — отказ.
ConnectPort 443
ConnectPort 6443

# Allow-list имён: точное совпадение, всё, чего нет в списке, — 403.
FilterDefaultDeny Yes
FilterType fnmatch
Filter "/etc/tinyproxy/allowlist"

# Конфиг egress-прокси (docs/ISOLATION.md раздел 3). Пропускается только CONNECT к парам
# «имя:порт» из allowlist; всё остальное — 403.
#
# FilterURLs On: фильтр сверяет весь адрес запроса, а не одно имя. У CONNECT адрес — «имя:порт»,
# он совпадает с записью allow-list. У обычного HTTP адрес — «http://…», он не совпадает никогда,
# поэтому обычный HTTP запрещён целиком. Без этого через прокси открывался бы любой порт
# разрешённого имени (http://нода-kind:10256/ прошёл бы — проверено).
Port 8888
# Только IPv4: без этой строки tinyproxy слушает ещё и ::.
Listen 0.0.0.0
FilterDefaultDeny Yes
FilterType fnmatch
FilterURLs On
Filter "/etc/tinyproxy/allowlist"

name: k8s-incident-agent
# Запуск агента в контейнере (ТЗ N2, docs/ISOLATION.md разделы 3–4).
#
#   make agent-tool TOOL=k8s_list_pods ARGS="--ns payments"
#
# Каждая строка ниже снимает одну возможность, которая агенту не нужна. Проверки —
# `make isolation-test`, разделы «№4 Контейнер» и «№5 Сеть».
#
# Сеть: агент живёт только во внутренней сети agent-egress, у которой нет выхода наружу.
# Единственный путь из неё — egress-proxy с allow-list из двух адресов: LLM-шлюз и API-сервер.

services:
  agent:
    build: .
    image: k8s-incident-agent:dev
    user: "10001:10001"            # не root, даже если в образе USER потеряют
    read_only: true                # агент не может дописать себе код или конфиг
    cap_drop: [ALL]                # ни одна capability не нужна: нет bind <1024, ptrace, mount
    security_opt:
      - no-new-privileges:true     # setuid-бинарники не поднимут привилегии
    pids_limit: 256                # зацикливание не съест хост
    mem_limit: 512m                # пик сейчас ~90 МиБ; пересмотреть на М6 (bge-m3)
    tmpfs:
      - /tmp:size=64m              # nosuid, nodev, noexec Docker ставит на tmpfs сам
    environment:
      # И клиент kubernetes, и httpx (LLM на М4) сами берут прокси из этих переменных.
      HTTPS_PROXY: http://egress-proxy:8888
      HTTP_PROXY: http://egress-proxy:8888
    volumes:
      # Только kubeconfig диагноста, только чтение. Адрес API-сервера в нём — имя ноды kind
      # в docker-сети, а не 127.0.0.1 хоста. Файл выпускает stand/up.sh. Длинная запись —
      # чтобы при отсутствии файла была ошибка, а не пустой каталог на его месте.
      - type: bind
        source: ./.kube/agent-ro.container.kubeconfig
        target: /app/.kube/agent-ro.kubeconfig
        read_only: true
        bind:
          create_host_path: false
      # /var/run/docker.sock не монтируется намеренно: с ним контейнер управлял бы хостом.
    networks: [agent-egress]
    depends_on: [egress-proxy]

  egress-proxy:
    build: stand/egress-proxy
    image: k8s-incident-agent-egress-proxy:dev
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks: [agent-egress, kind]  # мост: внутренняя сеть агента ↔ сеть kind с выходом наружу

networks:
  agent-egress:
    internal: true                 # нет маршрута наружу
    driver_opts:
      # internal убирает маршрут по умолчанию, но адрес моста (x.x.x.1) остаётся — и это хост:
      # до его сервисов агент дошёл бы напрямую. Без IPv4 на мосту хост из этой сети не виден.
      com.docker.network.bridge.inhibit_ipv4: "true"
  kind:
    external: true                 # сеть, которую создаёт kind; в ней API-сервер и выход наружу

# CI на каждый PR (ТЗ раздел 10) и проверка N6 на чистой машине.
#
# check — то же, что `make check` у автора: линт и юнит-тесты, кластер не нужен.
# stand — стенд из чистого клона одной командой и приёмка М1: S1 виден, Secret замаскирован.
# Системные evals с LLM добавятся на этапе М8.

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: Линт и юнит-тесты
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.20"
      - run: uv sync --locked
      - run: make check

  stand:
    name: Стенд kind и приёмка М1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.20"
      # На раннере уже есть kind неизвестной версии; ставим поверх ту же, что у автора.
      - name: kind v0.33.0
        run: |
          curl -fsSLo "$RUNNER_TEMP/kind" https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          sudo install -m 0755 "$RUNNER_TEMP/kind" /usr/local/bin/kind
          kind version
      - run: uv sync --locked
      - run: make stand
      - run: make isolation-test
      - run: make demo-secrets | tee demo-s1.txt
        env:
          # Без этого rich переносит строки по 80 символов и разрезает значение Secret:
          # grep ниже не нашёл бы его даже при утечке. Проверено на коде с известной утечкой.
          COLUMNS: "100000"
      - name: Значение Secret не попало в вывод инструментов (N1)
        run: |
          # data у Secret приходит из API в base64 — ищем обе формы значения.
          b64=$(printf %s s3cr3t-do-not-leak | base64)
          if grep -qF -e s3cr3t-do-not-leak -e "$b64" demo-s1.txt; then
            echo "::error::значение Secret payments-db есть в выводе make demo-secrets"
            exit 1
          fi
          grep -q '\*\*\*masked\*\*\*' demo-s1.txt
      - name: "S1: k8s_logs --previous приносит FATAL-строку — главное свидетельство"
        env:
          COLUMNS: "100000"
        run: |
          pod=$(kubectl --context kind-k8s-incident-agent -n payments get pod -l app=api \
                -o jsonpath='{.items[0].metadata.name}')
          # Лог предыдущего запуска может быть недоступен в момент рестарта контейнера.
          for attempt in 1 2 3; do
            make tool TOOL=k8s_logs ARGS="--pod $pod --ns payments --previous" | tee logs.txt
            grep -q 'FATAL: environment variable DB_PASSWORD is not set' logs.txt && exit 0
            sleep 5
          done
          exit 1
      - name: k8s_top отдаёт метрики (metrics-server на стенде)
        run: |
          make tool TOOL=k8s_top ARGS="--ns payments" | tee top.txt
          grep -q '^ok ' top.txt

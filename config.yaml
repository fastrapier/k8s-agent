# Конфигурация k8s-incident-agent.
# Значения вида ${VAR} подставляются из окружения процесса и из local.env
# (local.env в git не попадает, см. .gitignore).

# Бюджет одного инцидента. Числа и их обоснование — docs/TZ.md, N3 и F5.
budget:
  max_tool_calls: 15          # N3: полный обход одного сценария с запасом на одну неудачную ветку
  max_seconds: 180            # N3: верхняя граница ожидания инженера
  max_review_iterations: 2    # F5: потолок петли «ревьюер → диагност»

# LLM. Любая OpenAI-совместимая модель подключается сменой этих полей (N7).
llm:
  base_url: ${LLM_API_URL}
  api_key: ${LLM_API_TOKEN}
  # Выбрана сравнением моделей (М3, docs/LLM_SELECTION.md §7–8): лучший итог, без дисквалификаторов.
  model: z-ai/glm-5.3
  temperature: 0.0

# Слой инструментов.
tools:
  max_output_chars: 8000      # лимит обрезки сырого вывода одного инструмента
  default_log_tail: 200       # сколько последних строк лога берём, если tail не задан

# Целевой кластер. Имена стенда живут только здесь, в коде их нет.
k8s:
  context: kind-k8s-incident-agent
  default_namespace: default
  # Файлы выпускает stand/up.sh; пути относительно корня репозитория.
  readonly_kubeconfig: .kube/agent-ro.kubeconfig   # токен SA incident-agent-ro
  readwrite_kubeconfig: .kube/agent-rw.kubeconfig  # токен SA incident-agent-rw

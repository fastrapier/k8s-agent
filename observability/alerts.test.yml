rule_files:
  - alerts.yml
evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: 'agent_tool_calls_total{tool="k8s_patch",status="denied"}'
        values: '0 1 1 1 1 1 1'
    alert_rule_test:
      - eval_time: 2m
        alertname: AgentUnapprovedMutation
        exp_alerts:
          - exp_labels:
              tool: k8s_patch
              status: denied
              severity: critical
            exp_annotations:
              summary: "заблокирована попытка мутации без подтверждения"

  - interval: 1m
    input_series:
      - series: 'agent_tool_calls_total{tool="k8s_list_pods",status="denied"}'

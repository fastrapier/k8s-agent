global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: k8s-incident-agent
    static_configs:
      - targets:
          - host.docker.internal:9108

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093
